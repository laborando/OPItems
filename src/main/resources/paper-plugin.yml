name: OPItems
description: The OPItems Plugin
authors: [ cel20 ]
version: '1.11.3'

main: cel20.op.Main
api-version: '1.20.6'

commands:
  opitems:
    description: OPItems's main command
    usage: /opitems < help | gui | recipes | update | skull | upgradeItems >
  items:
    description: Lets you remove loaded Items / gets the amount of items loaded by players
    usage: /items <remove | player_heap >

#Load After:
softdepend: [Multiverse-Core]

load: POSTWORLD